spring.application.name=FarmConnect

# MySQL connection. Create the farmconnect database before running the app.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farmconnect}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Convenient for development. Use migrations and validate in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
server.port=8080

farmconnect.upload-dir=uploads/crops
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
