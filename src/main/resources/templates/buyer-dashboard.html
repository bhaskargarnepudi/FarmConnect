<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Buyer Dashboard | FarmConnect</title><link rel="stylesheet" th:href="@{/css/auth.css}"></head><body><main class="auth-card dashboard-card"><a class="brand" th:href="@{/}">🌱 FarmConnect</a><h1>Welcome, <span th:text="${buyerName}">Buyer</span>!</h1><p class="muted">Your buyer account is ready.</p><div class="message success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="message error" th:if="${errorMessage}" th:text="${errorMessage}"></div><div class="profile-detail"><strong>Registered email</strong><p th:text="${buyerEmail}">buyer@example.com</p></div><a class="primary-button button-link" th:href="@{/#marketplace}">Browse marketplace</a><h2>My orders</h2><p th:if="${#lists.isEmpty(orders)}">You haven't placed any orders yet.</p><div class="profile-detail" th:each="order : ${orders}"><strong th:text="${order.productName}">Crop name</strong><p>Quantity: <span th:text="${order.quantity}">1</span></p><p>Total: ₹<span th:text="${order.totalPrice}">0.00</span></p><p>Status: <span th:text="${order.status}">PLACED</span></p><small>Order #<span th:text="${order.id}">1</span> · <span th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}">date</span></small></div><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="secondary-button" type="submit">Log out</button></form></main></body></html>
