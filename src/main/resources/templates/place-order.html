<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Place Order | FarmConnect</title><link rel="stylesheet" th:href="@{/css/auth.css}"></head><body><main class="auth-card"><a class="brand" th:href="@{/}">🌱 FarmConnect</a><h1>Place an order</h1><div class="profile-detail"><strong th:text="${product.name}">Crop</strong><p>Farmer: <span th:text="${product.farmerName}">Farmer</span></p><p>Price: ₹<span th:text="${product.price}">0.00</span> per <span th:text="${product.unit}">unit</span></p><p>Available: <span th:text="${product.quantityAvailable}">0</span> <span th:text="${product.unit}">unit</span></p></div><form th:action="@{/buyer/orders}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="productId" th:value="${product.id}"><label for="quantity">Quantity</label><input id="quantity" name="quantity" type="number" min="1" th:max="${product.quantityAvailable}" value="1" required><button class="primary-button" type="submit">Confirm order</button></form><a class="back-link" th:href="@{/}">Cancel and return to marketplace</a></main></body></html>
