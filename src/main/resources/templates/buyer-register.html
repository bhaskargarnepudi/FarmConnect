<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Buyer Registration | FarmConnect</title><link rel="stylesheet" th:href="@{/css/auth.css}"></head><body><main class="auth-card"><a class="brand" th:href="@{/}">🌱 FarmConnect</a><h1>Create buyer account</h1><p class="muted">Join the marketplace and order directly from farmers.</p><div class="message error" th:if="${errorMessage}" th:text="${errorMessage}"></div><form th:action="@{/buyer/register}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label for="name">Full name</label><input id="name" name="name" required maxlength="100"><label for="email">Email address</label><input id="email" name="email" type="email" required maxlength="254"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" required maxlength="20"><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" maxlength="72" required><button class="primary-button" type="submit">Create buyer account</button></form><p class="switch-link">Already registered? <a th:href="@{/login}">Log in</a></p><p class="switch-link">Are you a farmer? <a th:href="@{/register}">Farmer registration</a></p><a class="back-link" th:href="@{/}">← Back to marketplace</a></main></body></html>
