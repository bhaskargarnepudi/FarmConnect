<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Crops | FarmConnect</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <style>
        body { background:#f2f7f1; padding:28px 14px; font-family:Arial,sans-serif; }
        .page { max-width:1000px; margin:auto; }
        .top { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
        .top a { color:#237a3b; text-decoration:none; font-weight:bold; }
        .message { padding:12px; border-radius:8px; margin:12px 0; background:#e5f7e9; color:#17632b; }
        .error { background:#ffe8e8; color:#a40000; }
        .crop-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; }
        .crop-card { background:white; border-radius:12px; overflow:hidden; box-shadow:0 4px 16px #00000010; }
        .crop-card img { width:100%; height:170px; object-fit:cover; background:#eef3ed; }
        .body { padding:16px; }
        .body h2 { margin:0 0 8px; font-size:20px; }
        .muted { color:#66736a; font-size:14px; }
        .actions { display:flex; gap:10px; margin-top:15px; }
        .actions a,.actions button { flex:1; text-align:center; border:0; border-radius:7px; padding:10px; cursor:pointer; text-decoration:none; font-weight:bold; font-size:14px; }
        .edit { background:#237a3b; color:white; }
        .delete { background:#ffe8e8; color:#a40000; }
        .empty { background:white; border-radius:12px; padding:28px; text-align:center; }
    </style>
</head>
<body>
<div class="page">
    <div class="top">
        <a th:href="@{/farmer/dashboard}">← Back to Dashboard</a>
        <a th:href="@{/farmer/crops/new}">+ Add Crop</a>
    </div>
    <h1>My Crops 🌾</h1>
    <p class="muted">Edit your crop details or remove a listing from the marketplace.</p>
    <div class="message" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="message error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="crop-grid" th:if="${!#lists.isEmpty(crops)}">
        <article class="crop-card" th:each="crop : ${crops}">
            <img th:src="${crop.imageUrl}" th:alt="${crop.name}" onerror="this.style.display='none'">
            <div class="body">
                <h2 th:text="${crop.name}">Crop name</h2>
                <p><strong>₹<span th:text="${#numbers.formatDecimal(crop.price,1,2)}">0.00</span></strong> <span class="muted" th:text="'/ ' + ${crop.unit}">/ kg</span></p>
                <p class="muted"><span th:text="${crop.quantityAvailable}">0</span> available · <span th:text="${crop.location}">Location</span></p>
                <p class="muted" th:text="${crop.quality}">Quality</p>
                <div class="actions">
                    <a class="edit" th:href="@{/farmer/crops/{id}/edit(id=${crop.id})}">Edit</a>
                    <form th:action="@{/farmer/crops/{id}/delete(id=${crop.id})}" method="post" style="display:flex;flex:1" onsubmit="return confirm('Delete this crop from the marketplace?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="delete" type="submit">Delete</button>
                    </form>
                </div>
            </div>
        </article>
    </div>
    <div class="empty" th:if="${#lists.isEmpty(crops)}">
        <h2>No crops found yet</h2>
        <p>Add a crop to start listing your produce.</p>
        <a th:href="@{/farmer/crops/new}">Add your first crop</a>
    </div>
</div>
</body>
</html>
