
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Crop | FarmConnect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f2f7f1;
            color: #24352a;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 5px 20px #00000012;
        }

        h1 {
            color: #237a3b;
            margin-top: 0;
        }

        .subtitle {
            color: #68776c;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccd7ce;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #237a3b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #195d2c;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #237a3b;
            text-decoration: none;
        }

        .message {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .error {
            background: #ffe8e8;
            color: #a40000;
        }
    </style>
</head>

<body>
<div class="container">

    <a class="back-link" th:href="@{/farmer/dashboard}">
        &larr; Back to Dashboard
    </a>

    <h1>Add Your Crop 🌾</h1>
    <p class="subtitle">Share your farm products with buyers.</p>

    <div class="message error"
         th:if="${errorMessage}"
         th:text="${errorMessage}">
    </div>

    <form th:action="@{/farmer/crops}"
          method="post"
          enctype="multipart/form-data">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="form-group">
            <label for="name">Crop Name</label>
            <input id="name" name="name" type="text"
                   placeholder="e.g. Fresh Tomatoes" required>
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">Select category</option>
                <option value="Vegetables">Vegetables</option>
                <option value="Fruits">Fruits</option>
                <option value="Rice">Rice & Grains</option>
                <option value="Pulses">Pulses</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description"
                      placeholder="Describe your crop" required></textarea>
        </div>

        <div class="form-group">
            <label for="price">Price (₹ per unit)</label>
            <input id="price" name="price" type="number"
                   min="0.01" step="0.01"
                   placeholder="e.g. 30" required>
        </div>

        <div class="form-group">
            <label for="unit">Selling Unit</label>
            <select id="unit" name="unit" required>
                <option value="">Select unit</option>
                <option value="1 kg">1 kg</option>
                <option value="1 quintal">1 quintal</option>
                <option value="1 dozen">1 dozen</option>
                <option value="25 kg bag">25 kg bag</option>
            </select>
        </div>

        <div class="form-group">
            <label for="quantity">Available Quantity</label>
            <input id="quantity" name="quantity" type="number"
                   min="0" placeholder="e.g. 100" required>
        </div>

        <div class="form-group">
            <label for="quality">Crop Quality</label>
            <input id="quality" name="quality" type="text"
                   placeholder="e.g. Fresh harvest" required>
        </div>

        <div class="form-group">
            <label for="location">Farm Location</label>
            <input id="location" name="location" type="text"
                   placeholder="e.g. Guntur, Andhra Pradesh" required>
        </div>

        <div class="form-group">
            <label for="image">Crop Photo (JPG, PNG or WEBP; max 5 MB)</label>
            <input id="image" name="image" type="file"
                   accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
                   required>
        </div>

        <button type="submit">Upload Crop</button>
    </form>

</div>
</body>
</html>
