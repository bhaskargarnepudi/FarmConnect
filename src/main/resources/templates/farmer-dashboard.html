
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Dashboard | FarmConnect</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-card dashboard-card">
    <a class="brand" th:href="@{/}">🌱 FarmConnect</a>

    <h1>Welcome, <span th:text="${farmerName}">Farmer</span>!</h1>
    <p class="muted">You are logged in to your farmer account.</p>
    
<div th:if="${successMessage}"
     class="profile-detail"
     style="color: green;"
     th:text="${successMessage}">
</div>

<div th:if="${errorMessage}"
     class="profile-detail"
     style="color: red;"
     th:text="${errorMessage}">
</div>

<a class="primary-button button-link"
   th:href="@{/farmer/crops/new}">
    + Add Crop
</a>

<a class="primary-button button-link" th:href="@{/farmer/crops}">
    Manage My Crops
</a>


    <a class="primary-button button-link" th:href="@{/farmer/dashboard#orders}">View Orders</a>
    <div id="orders" class="profile-detail">
        <strong>Recent orders for your crops</strong>
        <p th:if="${#lists.isEmpty(farmerOrders)}">No orders yet.</p>
        <div th:each="order : ${farmerOrders}">
            <p><strong th:text="${order.productName}">Crop</strong> — <span th:text="${order.quantity}">1</span> unit(s), ₹<span th:text="${order.totalPrice}">0.00</span> · <span th:text="${order.status}">PLACED</span></p>
            <small>Buyer: <span th:text="${order.buyerName}">Buyer</span> (<span th:text="${order.buyerEmail}">buyer@example.com</span>)</small>
        </div>
    </div>

    <div class="profile-detail">
        <strong>Registered email</strong>
        <p th:text="${farmerEmail}">farmer@example.com</p>
    </div>

    <a class="primary-button button-link" th:href="@{/}">
        Browse marketplace
    </a>

    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">
        <button class="secondary-button" type="submit">
            Log out
        </button>
    </form>
</main>
</body>
</html>
